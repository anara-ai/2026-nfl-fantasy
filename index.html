<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07090D">
<title>Draft Room</title><link rel="manifest" href="manifest.json">
<style>
:root{
--bg:#07090D;--s1:#0E1218;--s2:#161B24;--s3:#1F2632;--s4:#2A3341;
--tx:#F2F5F9;--t2:#98A3B3;--t3:#5D6878;
--bd:#1A202A;--bd2:#2B3441;
--ok:#22D48A;--okd:#0C2A1E;--bad:#FF5C57;--badd:#2E1414;
--gold:#FFC53D;--goldd:#2E2410;--acc:#4D8DF6;--accd:#0F1D33;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--tx);font:400 16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ---------- header ---------- */
.hd{position:sticky;top:0;z-index:60;background:linear-gradient(180deg,#0B0F15 0%,#07090D 100%);
border-bottom:1px solid var(--bd);padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.hd.live{background:linear-gradient(180deg,#2A2008 0%,#0F0C05 100%);border-bottom-color:#4A3A10}
.hdtop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.kick{font:600 10px/1 -apple-system,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--t3)}
.hd.live .kick{color:var(--gold)}
.big{font:700 26px/1.1 -apple-system,sans-serif;letter-spacing:-.03em;margin-top:5px}
.hd.live .big{color:var(--gold)}
.pillbox{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.pill{font:600 11px/1 -apple-system,sans-serif;padding:6px 10px;border-radius:6px;background:var(--s2);color:var(--t2);white-space:nowrap}
.pill.gold{background:var(--goldd);color:var(--gold)}
.iconbtn{width:38px;height:38px;border-radius:10px;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--t2)}
.prog{height:3px;background:var(--s2);border-radius:2px;margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--ok));transition:width .35s}
.filters{display:flex;gap:5px;margin-top:11px}
.fb{flex:1;text-align:center;font:600 12px/1 -apple-system,sans-serif;padding:10px 0;border-radius:8px;background:var(--s2);color:var(--t3);letter-spacing:.02em}
.fb.on{background:var(--tx);color:#07090D}

/* ---------- alerts ---------- */
.alertbar{display:flex;align-items:center;gap:9px;padding:11px 14px;font:600 13px/1.3 -apple-system,sans-serif;
background:linear-gradient(90deg,var(--goldd),transparent);border-bottom:1px solid var(--bd);color:var(--gold)}
.alertbar .bolt{font-size:15px}
.best{padding:13px 14px;border-bottom:1px solid var(--bd);background:linear-gradient(135deg,#0F1D33 0%,#0A0F17 70%);
display:flex;align-items:center;gap:12px}
.bestk{font:600 9.5px/1 -apple-system,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#6FA5F0}
.bestn{font:700 19px/1.15 -apple-system,sans-serif;letter-spacing:-.03em;margin-top:4px}
.bestm{font:500 12px/1.3 -apple-system,sans-serif;color:#7E9AC4;margin-top:3px}

/* ---------- tier ---------- */
.tier{display:flex;align-items:center;gap:9px;padding:9px 14px;position:sticky;top:0;z-index:20;
background:#0B0F15;border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.tierbar{width:22px;height:3px;border-radius:2px}
.tiert{font:700 10.5px/1 -apple-system,sans-serif;letter-spacing:.13em;text-transform:uppercase}
.tierc{font:500 10.5px/1 -apple-system,sans-serif;color:var(--t3);letter-spacing:.06em}
.tierw{margin-left:auto;font:700 9.5px/1 -apple-system,sans-serif;letter-spacing:.1em;text-transform:uppercase;
color:var(--gold);background:var(--goldd);padding:4px 7px;border-radius:4px}

/* ---------- row ---------- */
.row{display:flex;align-items:center;gap:11px;padding:12px 14px 12px 0;border-bottom:1px solid var(--bd);
min-height:62px;position:relative;background:var(--bg)}
.row:active{background:var(--s1)}
.tc{width:4px;align-self:stretch;flex:0 0 4px;border-radius:0 3px 3px 0}
.rk{font:700 15px/1 -apple-system,sans-serif;color:var(--t3);width:28px;flex:0 0 28px;text-align:right}
.mid{flex:1;min-width:0}
.nm{font:600 15.5px/1.25 -apple-system,sans-serif;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt{font:400 12px/1.35 -apple-system,sans-serif;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.mt b{font-weight:600}
.mt .w{color:var(--gold)}.mt .g{color:var(--ok)}.mt .r{color:var(--bad)}
.posc{font:700 9.5px/1 -apple-system,sans-serif;letter-spacing:.06em;padding:3px 5px;border-radius:3px;background:var(--s3);color:var(--t2);margin-right:5px}
.bdg{font:700 12px/1 -apple-system,sans-serif;padding:5px 8px;border-radius:6px;white-space:nowrap}
.bdg.up{background:var(--okd);color:var(--ok)}.bdg.dn{background:var(--badd);color:var(--bad)}
.sevdot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.row.mine{background:linear-gradient(90deg,#0C2A1E 0%,#080D0B 60%)}
.row.mine .rk{color:var(--ok)}
.chev{color:var(--t3);font-size:13px;flex:0 0 auto}

/* ---------- sheets / player page ---------- */
.sheet{position:fixed;inset:0;z-index:200;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;
padding-bottom:calc(30px + env(safe-area-inset-bottom))}
.sheet.hide{display:none}
.shhd{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;
padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--bg);border-bottom:1px solid var(--bd)}
.back{font:600 15px/1 -apple-system,sans-serif;color:var(--acc)}
.hero{padding:20px 16px 18px;position:relative;overflow:hidden}
.heroglow{position:absolute;top:-70px;left:-30px;width:230px;height:230px;border-radius:50%;filter:blur(70px);opacity:.34}
.hpos{position:relative;font:700 10px/1 -apple-system,sans-serif;letter-spacing:.15em;text-transform:uppercase;color:var(--t2)}
.hname{position:relative;font:800 31px/1.05 -apple-system,sans-serif;letter-spacing:-.035em;margin-top:7px}
.hmeta{position:relative;font:500 13px/1 -apple-system,sans-serif;color:var(--t2);margin-top:9px}
.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--bd);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.stat{background:var(--bg);padding:13px 6px;text-align:center}
.statv{font:800 21px/1 -apple-system,sans-serif;letter-spacing:-.03em}
.statl{font:500 9.5px/1 -apple-system,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-top:6px}
.verdict{margin:14px;padding:14px;border-radius:12px;font:500 14.5px/1.5 -apple-system,sans-serif}
.v-up{background:var(--okd);color:#7FEFC0;border-left:3px solid var(--ok)}
.v-dn{background:var(--badd);color:#FFA6A2;border-left:3px solid var(--bad)}
.v-nu{background:var(--s2);color:var(--t2);border-left:3px solid var(--s4)}
.blk{padding:16px 14px;border-top:1px solid var(--bd)}
.blkh{font:700 10px/1 -apple-system,sans-serif;letter-spacing:.15em;text-transform:uppercase;color:var(--t3);margin-bottom:13px}
.sbar{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.sbl{font:600 11px/1 -apple-system,sans-serif;color:var(--t2);width:42px;flex:0 0 42px}
.sbt{flex:1;height:22px;background:var(--s1);border-radius:4px;position:relative;overflow:hidden}
.sbf{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.sbv{font:700 12px/1 -apple-system,sans-serif;width:30px;flex:0 0 30px;text-align:right}
.meanline{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--tx);opacity:.6;z-index:2}
.newsc{margin:0 14px 14px;padding:14px;border-radius:12px;font:400 14px/1.55 -apple-system,sans-serif}
.newsh{font:700 10px/1 -apple-system,sans-serif;letter-spacing:.13em;text-transform:uppercase;margin-bottom:8px}
.n3{background:var(--badd);color:#FFB3B0}.n3 .newsh{color:var(--bad)}
.n2{background:var(--goldd);color:#F5D48C}.n2 .newsh{color:var(--gold)}
.n1{background:var(--s2);color:var(--t2)}.n1 .newsh{color:var(--t3)}
.n0{background:var(--okd);color:#96EFC4}.n0 .newsh{color:var(--ok)}
.dl{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--bd);font:400 13.5px/1.4 -apple-system,sans-serif}
.dl:last-child{border-bottom:none}
.dlk{color:var(--t3);flex:0 0 118px}.dlv{color:var(--tx);text-align:right;flex:1}
.acts{position:sticky;bottom:0;display:flex;gap:9px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));
background:linear-gradient(180deg,rgba(7,9,13,0) 0%,var(--bg) 26%)}
.act{flex:1;text-align:center;font:700 14.5px/1 -apple-system,sans-serif;padding:15px 0;border-radius:11px}
.a1{background:var(--ok);color:#04150E}.a2{background:var(--s3);color:var(--tx)}.a3{background:var(--s2);color:var(--t2)}

/* ---------- search ---------- */
.srchwrap{padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--bd)}
.srchin{flex:1;padding:12px 14px;border-radius:10px;background:var(--s2);border:1px solid var(--bd2);color:var(--tx);font-size:16px}
.srchin::placeholder{color:var(--t3)}
.sres{display:flex;align-items:center;gap:11px;padding:13px 14px 13px 0;border-bottom:1px solid var(--bd);min-height:60px}

/* ---------- brief ---------- */
.hgroup{padding:22px 14px 10px}
.hg1{font:800 25px/1.1 -apple-system,sans-serif;letter-spacing:-.03em}
.hg2{font:400 13px/1.45 -apple-system,sans-serif;color:var(--t2);margin-top:7px}
.segs{display:flex;gap:5px;padding:0 14px 14px}
.seg{flex:1;text-align:center;font:600 12px/1 -apple-system,sans-serif;padding:11px 0;border-radius:9px;background:var(--s2);color:var(--t3)}
.seg.on{background:var(--tx);color:#07090D}
.nc{display:flex;gap:11px;padding:14px;border-bottom:1px solid var(--bd)}
.ncbar{width:3px;flex:0 0 3px;border-radius:2px}
.nctop{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ncn{font:700 15px/1.2 -apple-system,sans-serif;letter-spacing:-.02em}
.nctag{font:700 9px/1 -apple-system,sans-serif;letter-spacing:.09em;text-transform:uppercase;padding:3.5px 6px;border-radius:3px}
.ncb{font:400 13.5px/1.5 -apple-system,sans-serif;color:var(--t2);margin-top:7px}
.edge{padding:18px 14px;border-bottom:1px solid var(--bd)}
.edgen{font:800 30px/1 -apple-system,sans-serif;color:var(--s4);letter-spacing:-.04em}
.edgeh{font:700 17px/1.25 -apple-system,sans-serif;letter-spacing:-.025em;margin:9px 0 8px}
.edgeb{font:400 14px/1.6 -apple-system,sans-serif;color:var(--t2)}
.byec{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid var(--bd)}
.byew{font:800 15px/1 -apple-system,sans-serif;width:46px;flex:0 0 46px}
.byew.trap{color:var(--gold)}
.byet{display:flex;flex-wrap:wrap;gap:5px}
.byeteam{font:600 10.5px/1 -apple-system,sans-serif;padding:5px 7px;border-radius:4px;background:var(--s2);color:var(--t2)}

/* ---------- team ---------- */
.slot{display:flex;align-items:center;gap:11px;padding:12px 14px 12px 0;border-bottom:1px solid var(--bd);min-height:56px}
.sl{font:700 10px/1 -apple-system,sans-serif;letter-spacing:.1em;color:var(--t3);width:44px;flex:0 0 44px}
.sv{flex:1;font:600 14.5px/1.25 -apple-system,sans-serif}
.sv.e{color:var(--t3);font-weight:400;font-style:italic}
.svm{font:400 11.5px/1 -apple-system,sans-serif;color:var(--t3);margin-top:3px}
.needs{display:flex;flex-wrap:wrap;gap:6px;padding:14px}
.need{font:600 12px/1 -apple-system,sans-serif;padding:8px 11px;border-radius:7px;background:var(--s2);color:var(--t2)}
.need.hot{background:var(--goldd);color:var(--gold)}
.need.ok{background:var(--okd);color:var(--ok)}

/* ---------- plan ---------- */
.pk{border-bottom:1px solid var(--bd)}
.pkh{display:flex;align-items:center;gap:12px;padding:15px 14px;min-height:58px}
.pkn{font:800 12px/1 -apple-system,sans-serif;width:54px;flex:0 0 54px;color:var(--t3);letter-spacing:.03em}
.pkt{flex:1;font:600 14.5px/1.3 -apple-system,sans-serif;letter-spacing:-.02em}
.pk.now{background:linear-gradient(90deg,var(--accd),transparent)}
.pk.now .pkn{color:var(--acc)}
.pk.done{opacity:.35}
.pkb{padding:0 14px 16px 14px}
.pkb p{font:400 14px/1.6 -apple-system,sans-serif;color:var(--t2)}
.tg{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tgi{font:600 12.5px/1 -apple-system,sans-serif;padding:9px 11px;border-radius:8px;background:var(--s2);color:var(--t2)}
.tgi.av{background:var(--okd);color:var(--ok)}
.tgi.gn{color:var(--t3);text-decoration:line-through;background:var(--s1)}
.tgi.mi{background:var(--ok);color:#04150E}

/* ---------- tabs ---------- */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:150;display:flex;
background:rgba(11,15,21,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
border-top:1px solid var(--bd2);padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;text-align:center;padding:9px 0 7px;color:var(--t3);font:600 9.5px/1 -apple-system,sans-serif;letter-spacing:.05em}
.tab .ic{font-size:18px;line-height:1.3;font-weight:400}
.tab.on{color:var(--tx)}
.toast{position:fixed;left:14px;right:14px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:300;
background:var(--s4);border-radius:12px;padding:13px 15px;display:none;align-items:center;justify-content:space-between;gap:12px;
font:500 13.5px/1.3 -apple-system,sans-serif;box-shadow:0 8px 28px rgba(0,0,0,.55)}
.toast.on{display:flex;animation:up .22s ease}
@keyframes up{from{transform:translateY(14px);opacity:0}}
.tu{font:700 13.5px/1 -apple-system,sans-serif;color:var(--gold);padding:5px}
.empty{padding:56px 24px;text-align:center;color:var(--t3);font:400 14px/1.6 -apple-system,sans-serif}
.mini{font:400 12px/1.6 -apple-system,sans-serif;color:var(--t3);padding:14px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.hd.live .kick{animation:pulse 1.6s ease-in-out infinite}
</style></head><body>
<div id="app"></div>
<div class="sheet hide" id="sheet"></div>
<div class="toast" id="toast"><span id="tm"></span><button class="tu" onclick="undo()">UNDO</button></div>
<nav class="tabs">
 <button class="tab on" data-tab="board"><div class="ic">▤</div>BOARD</button>
 <button class="tab" data-tab="team"><div class="ic">★</div>MY TEAM</button>
 <button class="tab" data-tab="plan"><div class="ic">◎</div>PLAN</button>
 <button class="tab" data-tab="brief"><div class="ic">◈</div>BRIEF</button>
</nav>
<script src="data.js"></script>
<script>
var D=window.DRAFT_DATA,P=D.players,byName={},byId={};
P.forEach(function(p){byName[p.n]=p;byId[p.id]=p;});
var TC={ARI:"#C4344F",ATL:"#D22B3A",BAL:"#6B5BD6",BUF:"#3A7BD5",CAR:"#0FA0E8",CHI:"#F26522",CIN:"#FB4F14",
CLE:"#FF6B35",DAL:"#4A8FE0",DEN:"#FB6C1E",DET:"#3A9BDC",GB:"#FFB612",HOU:"#D14257",IND:"#3A78C4",
JAX:"#12A5A8",KC:"#F02D48",LV:"#B9C1C6",LAC:"#22A5E8",LAR:"#FFB733",MIA:"#11B5BE",MIN:"#8B5CD6",
NE:"#E0344F",NO:"#D9C08A",NYG:"#D14257",NYJ:"#1E9E63",PHI:"#1B9E8F",PIT:"#FFC72C",SF:"#D63A3A",
SEA:"#7BD62E",TB:"#EF3B3B",TEN:"#5BA5E8",WAS:"#E3A93B"};
var TIERC=["#8B7BE8","#4D8DF6","#22D48A","#7BD62E","#FFC53D","#FF9A3D","#FF5C57","#7A8493"];
var KEY="draft2026.v1",st=load(),hist=[],tab="board",filter="ALL",openId=null,view=null,srch=false,q="",seg="news",openPk=3,tT=null;

function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.gone)return o;}}catch(e){}return{gone:{},mine:[],order:[]};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function buzz(ms){if(navigator.vibrate)try{navigator.vibrate(ms);}catch(e){}}
function made(){return st.order.length;}
function nextPick(){var n=made()+1;for(var i=0;i<D.league.picks.length;i++)if(D.league.picks[i]>=n)return D.league.picks[i];return null;}
function until(){var n=nextPick();return n===null?null:n-(made()+1);}
function isMine(id){return st.mine.indexOf(id)>=0;}

function mark(id,mine){
  var p=byId[id];if(!p)return;
  hist.push(JSON.stringify(st));if(hist.length>50)hist.shift();
  st.gone[id]=1;st.order.push(id);
  if(mine&&!isMine(id))st.mine.push(id);
  save();buzz(mine?[18,40,18]:14);closeSheet();render();
  toast((mine?"✓ Drafted ":"Off the board: ")+p.n);
}
function unmark(id){
  hist.push(JSON.stringify(st));
  delete st.gone[id];st.order=st.order.filter(function(x){return x!==id;});
  st.mine=st.mine.filter(function(x){return x!==id;});
  save();buzz(14);render();toast("Back on the board");
}
function undo(){if(!hist.length)return;st=JSON.parse(hist.pop());save();render();hideToast();buzz(14);}
function toast(m){var t=document.getElementById("toast");document.getElementById("tm").textContent=m;
  t.classList.add("on");clearTimeout(tT);tT=setTimeout(hideToast,3800);}
function hideToast(){document.getElementById("toast").classList.remove("on");}

function runAlert(){var l=st.order.slice(-6);if(l.length<5)return null;var c={};
  l.forEach(function(i){var p=byId[i];if(p&&"RB WR TE QB".indexOf(p.p)>=0)c[p.p]=(c[p.p]||0)+1;});
  for(var k in c)if(c[k]>=4)return k+" RUN — "+c[k]+" of the last "+l.length+" picks";return null;}
function myByes(){var b={};st.mine.forEach(function(i){var p=byId[i];if(p&&"RB WR TE QB".indexOf(p.p)>=0)b[p.b]=(b[p.b]||0)+1;});return b;}
function needs(){var h={QB:0,RB:0,WR:0,TE:0,K:0,DEF:0};
  st.mine.forEach(function(i){var p=byId[i];if(p)h[p.p]=(h[p.p]||0)+1;});
  var req={QB:1,RB:2,WR:2,TE:1,K:1,DEF:1},out=[];
  for(var k in req)if(h[k]<req[k])out.push({p:k,n:req[k]-h[k],hot:h[k]===0&&"RB WR".indexOf(k)>=0});
  return{have:h,missing:out};}
function avail(){return P.filter(function(p){return !st.gone[p.id]&&p.mean;}).sort(function(a,b){return a.rk-b.rk;});}

/* ---------- player page ---------- */
function openPlayer(id){view=id;renderSheet();window.scrollTo(0,0);}
function closeSheet(){view=null;srch=false;document.getElementById("sheet").classList.add("hide");}
function renderSheet(){
  var el=document.getElementById("sheet");
  if(srch){el.innerHTML=searchView();el.classList.remove("hide");
    setTimeout(function(){var i=document.getElementById("si");if(i)i.focus();},60);return;}
  if(view===null){el.classList.add("hide");return;}
  el.innerHTML=playerView(byId[view]);el.classList.remove("hide");el.scrollTop=0;
}
function playerView(p){
  var c=TC[p.t]||"#5D6878",gone=!!st.gone[p.id],mine=isMine(p.id);
  var h='<div class="shhd"><button class="back" onclick="closeSheet();render()">‹ Back</button>'+
    '<div style="flex:1"></div><button class="iconbtn" onclick="openSearch()">⌕</button></div>';
  h+='<div class="hero"><div class="heroglow" style="background:'+c+'"></div>'+
    '<div class="hpos">'+p.p+(p.pr?" "+p.pr:"")+' · '+p.t+'</div>'+
    '<div class="hname">'+esc(p.n)+'</div>'+
    '<div class="hmeta">Bye week '+p.b+(p.rd?" · goes around round "+p.rd:"")+
    (mine?' · <span style="color:var(--ok);font-weight:700">ON YOUR TEAM</span>':(gone?' · <span style="color:var(--bad)">taken</span>':''))+'</div></div>';

  if(p.mean){
    h+='<div class="statrow">'+
      '<div class="stat"><div class="statv num">'+p.rk+'</div><div class="statl">Overall</div></div>'+
      '<div class="stat"><div class="statv num">'+(p.pr||"–")+'</div><div class="statl">'+p.p+' rank</div></div>'+
      '<div class="stat"><div class="statv num" style="color:'+(p.gap>0?"var(--ok)":p.gap<0?"var(--bad)":"var(--tx)")+'">'+
        (p.gap===null?"–":(p.gap>0?"+":"")+Math.round(p.gap))+'</div><div class="statl">Value</div></div>'+
      '<div class="stat"><div class="statv num">'+p.sd+'</div><div class="statl">Spread</div></div></div>';

    var vc="v-nu",vt="";
    if(p.gap!==null&&p.gap>=8){vc="v-up";vt="Value. Experts rank him about "+Math.round(p.gap)+" spots higher than the market drafts him — you can take him at ADP and get a discount.";}
    else if(p.gap!==null&&p.gap<=-8){vc="v-dn";vt="Reach. The room drafts him roughly "+Math.abs(Math.round(p.gap))+" spots before the experts rank him. Let someone else pay.";}
    else if(p.sd>=10){vc="v-nu";vt="Contested. Boards range from "+p.lo+" to "+p.hi+" — someone has a strong take here, so trust your own read.";}
    else {vc="v-nu";vt="Fairly priced. Market and experts land within a few spots of each other.";}
    h+='<div class="verdict '+vc+'">'+esc(vt)+'</div>';

    var ks=["Yahoo","ADP","FFC","CBS","JE","DS","Mine"],vals=[];
    ks.forEach(function(k){if(p.src[k])vals.push(p.src[k]);});
    var lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals),span=Math.max(hi-lo,1);
    h+='<div class="blk"><div class="blkh">Where each board has him</div>';
    ks.forEach(function(k){
      var v=p.src[k];
      if(!v){h+='<div class="sbar"><div class="sbl">'+k+'</div><div class="sbt"></div><div class="sbv" style="color:var(--t3)">–</div></div>';return;}
      var pct=8+((hi-v)/span)*92;
      var col=v<p.mean-1?"var(--ok)":(v>p.mean+1?"var(--bad)":"var(--s4)");
      h+='<div class="sbar"><div class="sbl">'+k+'</div><div class="sbt">'+
        '<div class="sbf" style="width:'+pct.toFixed(1)+'%;background:'+col+';opacity:.85"></div></div>'+
        '<div class="sbv num">'+v+'</div></div>';
    });
    h+='<div style="font:400 11.5px/1.5 -apple-system,sans-serif;color:var(--t3);margin-top:10px">'+
      'Longer bar = ranked higher. Green beats his '+p.mean+' average, red is below it. Range '+p.lo+'–'+p.hi+' across '+p.ns+' boards.</div></div>';
  } else {
    h+='<div class="verdict v-nu">Kicker and defence ordering comes from a smaller set of sources. Take one late and stream on matchup.</div>';
  }

  if(p.news){
    var lbl=p.sev===3?"Major concern":p.sev===2?"Real risk":p.sev===0?"Positive":"Monitor";
    h+='<div class="newsc n'+p.sev+'"><div class="newsh">'+lbl+'</div>'+esc(p.news)+'</div>';
  }

  h+='<div class="blk"><div class="blkh">Detail</div>';
  function dl(k,v){if(v===null||v===undefined||v==="")return;h+='<div class="dl"><div class="dlk">'+k+'</div><div class="dlv">'+v+'</div></div>';}
  dl("Team",p.t+" · bye "+p.b);
  if(p.tier)dl("Tier",esc(p.tname||("Tier "+p.tier))+" · "+p.tsize+" players");
  if(p.yd!==null&&p.yd!==undefined)dl("Your Yahoo room",p.yd>0?"ranks him "+Math.round(p.yd)+" lower than the field — lasts longer here":(p.yd<0?"ranks him "+Math.abs(Math.round(p.yd))+" higher — goes early here":"in line with the field"));
  if(p.md!==null&&p.md!==undefined&&Math.abs(p.md)>=5)dl("My board",(p.md<0?"higher than consensus by "+Math.abs(Math.round(p.md)):"lower than consensus by "+Math.round(p.md))+" spots");
  if(p.inj)dl("Injury risk",p.inj+"% chance of missing time");
  if(p.hc)dl("Handcuff",'<span style="color:'+(byName[p.hc]&&st.gone[byName[p.hc].id]?"var(--t3)":"var(--tx)")+'">'+esc(p.hc)+(byName[p.hc]&&st.gone[byName[p.hc].id]?" (gone)":"")+'</span>');
  if(p.hcof)dl("Backing up",esc(p.hcof));
  if(p.cont)dl("Backfield note",'<span style="color:var(--gold)">'+esc(p.cont)+'</span>');
  if(p.why)dl("Read",esc(p.why));
  h+='</div>';

  h+='<div class="acts">';
  if(gone)h+='<div class="act a2" onclick="unmark('+p.id+');closeSheet();render()">Put back on board</div>';
  else h+='<div class="act a1" onclick="mark('+p.id+',true)">Draft to my team</div>'+
          '<div class="act a3" onclick="mark('+p.id+',false)">Mark gone</div>';
  h+='</div>';
  return h;
}

/* ---------- search ---------- */
function openSearch(){srch=true;view=null;q="";renderSheet();}
function setQ(v){q=v;var el=document.getElementById("res");if(el)el.innerHTML=results();}
function results(){
  if(!q.trim())return '<div class="empty">Type a name.<br><span style="color:var(--t3);font-size:13px">234 players, all seven boards, every injury note.</span></div>';

  return m.map(function(p){

      '<div class="rk num">'+(p.mean?p.rk:"–")+'</div><div class="mid"><div class="nm">'+esc(p.n)+

      '<div class="mt"><span class="posc">'+p.p+(p.pr||"")+'</span>'+p.t+' · bye '+p.b+
      (st.gone[p.id]&&!isMine(p.id)?' · <span class="r">taken</span>':'')+'</div></div>'+

  }).join("");
}
function searchView(){
  return '<div class="srchwrap"><input class="srchin" id="si" placeholder="Search any player" value="'+esc(q)+
    '" oninput="setQ(this.value)" autocomplete="off" autocorrect="off" spellcheck="false">'+
    '<button class="back" onclick="closeSheet();render()">Done</button></div><div id="res">'+results()+'</div>';

/* ---------- board ---------- */
function rowHTML(p){
  var mine=isMine(p.id),c=TC[p.t]||"#5D6878";
  var bb=myByes(),bf="";
  if(st.mine.length&&bb[p.b]>=2&&"RB WR TE QB".indexOf(p.p)>=0)bf=' · <span class="w">bye '+p.b+' ×'+(bb[p.b]+1)+'</span>';
  var meta='<span class="posc">'+p.p+(p.pr||"")+'</span>'+p.t+' · bye '+p.b+bf;
  if(p.news&&p.sev!==null&&p.sev!==undefined){
    var cl=p.sev>=2?"r":(p.sev===0?"g":"w");
    var sn=p.news.split(".")[0];if(sn.length>44)sn=sn.slice(0,42).replace(/[ ,;]+$/,"")+"…";
    meta='<span class="posc">'+p.p+(p.pr||"")+'</span>'+p.t+' · <span class="'+cl+'">'+esc(sn)+'</span>'+bf;
  }
  var bd="";
  if(p.sg)bd='<span class="bdg '+(p.gap>0?"up":"dn")+'">'+(p.gap>0?"+":"")+Math.round(p.gap)+'</span>';
  else if(p.sev>=2)bd='<span class="sevdot" style="background:'+(p.sev===3?"var(--bad)":"var(--gold)")+'"></span>';
  return '<div class="row'+(mine?" mine":"")+'" onclick="openPlayer('+p.id+')">'+
    '<div class="tc" style="background:'+c+'"></div><div class="rk num">'+(p.mean?p.rk:"–")+'</div>'+
    '<div class="mid"><div class="nm">'+esc(p.n)+'</div><div class="mt">'+meta+'</div></div>'+
    bd+'<div class="chev">›</div></div>';
}
function boardPane(){
  var u=until(),live=u!==null&&u<=1;
  var h='<div class="hd'+(live?" live":"")+'"><div class="hdtop"><div>'+
    '<div class="kick">'+(live?"● ":"")+'Pick '+(made()+1)+' · Round '+Math.min(15,Math.floor(made()/10)+1)+'</div>'+

  var av=avail();

    var nd=needs().missing.map(function(x){return x.p;});

    if(st.gone[p.id])return false;

    if(filter==="K/D")return p.p==="K"||p.p==="DEF";
    return p.p===filter;}).sort(function(a,b){return a.rk-b.rk;});
  if(!list.length)return h+'<div class="empty">Nothing left at this filter.</div>';
  var lt=null;

  var bench=mine.filter(function(p){return !used[p.id];});

  bench.forEach(function(p){var c=TC[p.t]||"#5D6878";
    h+='<div class="slot" onclick="openPlayer('+p.id+')"><div class="tc" style="background:'+c+';height:34px"></div>'+
      '<div class="sl">BN</div><div class="sv">'+esc(p.n)+'<div class="svm">'+p.p+' · '+p.t+' · bye '+p.b+'</div></div><div class="chev">›</div></div>';});
  var bb=myByes(),tr=[];for(var w in bb)if(bb[w]>=3)tr.push("Week "+w+" — "+bb[w]+" of your skill starters are off");

  h+='</div>';

  if(gaps.length){h+='<div class="blk"><div class="blkh">Handcuffs still free</div>';
